<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TradeBook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#e5e8ec;color:#1b1f24;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:#f5f6f8;padding-bottom:86px}
.demobar{background:#111827;color:#9ca3af;font-size:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap}
.demobar button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:999px;padding:6px 10px;font:500 12px Inter,sans-serif;cursor:pointer}
.demobar button.act{background:#14b8a6;color:#042f2e;border-color:#14b8a6;font-weight:700}
.demobar i{font-style:normal;background:#f59e0b;color:#111;border-radius:999px;padding:0 6px;margin-left:5px;font-size:10px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#0f766e;color:#fff;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:18px;letter-spacing:-.2px}.who{font-size:12px;opacity:.85}
.net{border:0;border-radius:999px;padding:7px 12px;font:600 13px Inter,sans-serif;display:flex;gap:7px;align-items:center;cursor:pointer}
.net.on{background:#ccfbf1;color:#115e59}.net.off{background:#fee2e2;color:#991b1b}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.net.sy .dot{animation:bl .6s infinite alternate}@keyframes bl{to{opacity:.2}}
.banner{padding:9px 16px;font-size:13px;line-height:1.4}.banner.off{background:#fef3c7;color:#92400e}.banner.sync{background:#e0f2fe;color:#075985}
main{padding:14px}
h2{font-size:14px;margin:18px 2px 8px;color:#4b5563;text-transform:uppercase;letter-spacing:.4px}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid #eceef1}
.click{cursor:pointer}.click:active{background:#fafafa}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:#6b7280;font-size:12px;margin-top:3px}
.items{font-size:13px;color:#374151;margin:8px 0;line-height:1.45}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.pending{background:#fef3c7;color:#92400e}.badge.dispatched{background:#dbeafe;color:#1e40af}.badge.delivered{background:#dcfce7;color:#166534}.badge.cancelled{background:#f3f4f6;color:#6b7280}
.pendtag{color:#b45309;font-weight:600;font-size:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:14px;padding:12px;border:1px solid #eceef1}.kpi .l{font-size:12px;color:#6b7280}.kpi .v{font-size:19px;font-weight:700;margin-top:4px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px Inter,sans-serif;cursor:pointer;background:#0f766e;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:12px}.btn.alt{background:#e6f4f2;color:#0f766e}.btn.red{background:#fee2e2;color:#991b1b}.btn.block{width:100%;padding:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 2px 11px;font:500 11px Inter,sans-serif;color:#6b7280;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.act{color:#0f766e;font-weight:700}nav .ic{font-size:19px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font:14px Inter,sans-serif;background:#fff;color:#111}
input:focus,select:focus{outline:2px solid #99f6e4;border-color:#14b8a6}
label{font-size:12px;color:#4b5563;font-weight:600;display:block;margin:12px 0 5px}
.step{display:flex;align-items:center;gap:6px}.step button{width:34px;height:34px;border-radius:9px;border:1px solid #d1d5db;background:#fff;font-size:18px;cursor:pointer;color:#0f766e}
.step span{min-width:24px;text-align:center;font-weight:700}
.prod{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f2f4;gap:10px}
.prod:last-child{border-bottom:0}.pn{font-weight:600;font-size:14px}
.cartbar{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:500px;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:7}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto;padding:16px 16px 26px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{margin:0;font-size:17px}.x{border:0;background:#f3f4f6;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:40;width:max-content;max-width:92vw}
.t{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;margin-top:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s}
.t.ok{background:#065f46}.t.off{background:#92400e}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 12px;font:600 12px Inter,sans-serif;cursor:pointer;white-space:nowrap;color:#374151}
.chip.act{background:#0f766e;color:#fff;border-color:#0f766e}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:16px}
.bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar{width:100%;background:linear-gradient(#2dd4bf,#0f766e);border-radius:6px 6px 2px 2px;min-height:3px}
.bl{font-size:10px;color:#6b7280}.bv{font-size:9px;color:#374151;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid #f1f2f4;text-align:left;vertical-align:top}th{font-size:11px;color:#6b7280;font-weight:600}
.r{text-align:right}
.seg{display:flex;background:#eef0f2;border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:600 13px Inter,sans-serif;cursor:pointer;color:#4b5563}.seg .act{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:#0f766e}
.red{color:#b91c1c}.green{color:#15803d}
.empty{text-align:center;color:#9ca3af;padding:26px 10px;font-size:14px}
.hist{border-left:2px solid #d1d5db;margin-left:6px;padding-left:12px}.hist div{margin-bottom:8px;font-size:13px}
.guide li{margin-bottom:9px;line-height:1.45;font-size:14px}
.warn{background:#fef2f2;color:#991b1b;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}

.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}
.login .logo{width:64px;height:64px;border-radius:18px;background:#0f766e;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.login h1{margin:0 0 4px;font-size:26px}
.uchip{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px;font:600 13px Inter,sans-serif;cursor:pointer;text-align:left}
.hd-r{display:flex;gap:8px;align-items:center}
nav button{font-size:10.5px;padding:9px 0 11px}nav .ic{font-size:18px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.rgrid .btn{text-align:left;font-size:13px;line-height:1.3}.rgrid .btn span{font-weight:400;font-size:11px;opacity:.75}
.kpi.click{cursor:pointer}.kpi.click:active{background:#f3f4f6}.warn.click{cursor:pointer}
.uchip{white-space:nowrap}.brand{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.navbrand{display:none}
@media (hover:hover){.click:hover{background:#fafbfb}.btn:hover{filter:brightness(.96)}nav button:hover{color:#0f766e}}
@media (min-width:900px){
  body{background:#eef1f4}
  #app{max-width:none;min-height:100vh;background:#f5f6f8}
  #app.in{padding:0 0 30px 240px}
  #app.out .login{max-width:420px;margin:0 auto}
  header{padding:14px 28px}
  header .brand{max-width:none;font-size:20px}
  .banner{padding:10px 28px}
  main{max-width:1080px;margin:0 auto;padding:24px 28px}
  nav{left:0;top:0;bottom:0;transform:none;width:240px;max-width:none;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid #e5e7eb;padding:0 12px;gap:2px;overflow-y:auto}
  .navbrand{display:block;font-weight:700;font-size:16px;color:#0f766e;padding:20px 10px 18px;border-bottom:1px solid #eef0f2;margin-bottom:10px;line-height:1.3}
  .navbrand span{display:block;font-weight:500;font-size:12px;color:#6b7280;margin-top:3px}
  nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:14px;border-radius:10px}
  nav button.act{background:#e6f4f2}
  nav .ic{font-size:18px;width:22px;text-align:center}
  .kpis{grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi .v{font-size:21px}
  .ov{align-items:center;padding:24px}
  .sh{border-radius:18px;max-width:720px;max-height:88vh;padding:22px 24px 26px}
  .cartbar{left:calc(240px + (100vw - 240px) / 2);width:min(1024px, calc(100vw - 296px));max-width:none;bottom:20px}
  #toast{top:76px;left:calc(240px + (100vw - 240px) / 2)}
  .rgrid{grid-template-columns:1fr 1fr 1fr}
  .bars{height:180px}
}
@media (min-width:1300px){ main{max-width:1180px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
