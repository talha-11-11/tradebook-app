services:
  - type: web
    name: tradebook
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in Render → Environment
